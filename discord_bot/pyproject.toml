[project]
name = "speca-discord"
version = "0.1.0"
description = "Discord bot wrapper for the SPECA security audit pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hirotake Murakami", email = "2009hirotake@gmail.com" }]
license = { text = "MIT" }
dependencies = [
  "discord.py>=2.4,<3.0",
  "python-dotenv>=1.0",
  "aiohttp>=3.9",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
speca-discord = "speca_discord.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speca_discord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --tb=short"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
